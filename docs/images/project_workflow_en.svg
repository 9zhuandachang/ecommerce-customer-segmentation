<svg xmlns="http://www.w3.org/2000/svg" width="1728" height="1510" viewBox="0 0 1728 1510" role="img" aria-label="From purchase records to four customer insights"><title>From purchase records to four customer insights</title><desc>Train and select models, then upload purchase records to produce customer segments, repurchase priorities, spending-potential rankings and product recommendations.</desc><rect x="0" y="0" width="1728" height="1510" rx="0" fill="#F5F9FE"/><rect x="52" y="154" width="770" height="520" rx="18" fill="#F6FAFF" stroke="#BFD5EC" stroke-width="2"/><rect x="906" y="154" width="770" height="520" rx="18" fill="#F6FAFF" stroke="#BFD5EC" stroke-width="2"/><rect x="88" y="225" width="698" height="110" rx="12" fill="#E8F3FF" stroke="#6CA5E4" stroke-width="2"/><rect x="88" y="365" width="698" height="120" rx="12" fill="#E8F3FF" stroke="#6CA5E4" stroke-width="2"/><rect x="88" y="515" width="698" height="130" rx="12" fill="#E8F3FF" stroke="#6CA5E4" stroke-width="2"/><rect x="942" y="225" width="698" height="110" rx="12" fill="#E8F3FF" stroke="#6CA5E4" stroke-width="2"/><rect x="942" y="365" width="698" height="120" rx="12" fill="#E8F3FF" stroke="#6CA5E4" stroke-width="2"/><rect x="942" y="515" width="698" height="130" rx="12" fill="#E8F3FF" stroke="#6CA5E4" stroke-width="2"/><polyline points="437,335 437,359" fill="none" stroke="#4675A8" stroke-width="3" stroke-linejoin="round"/><polyline points="427,346 437,359 447,346" fill="none" stroke="#4675A8" stroke-width="4"/><polyline points="437,485 437,509" fill="none" stroke="#4675A8" stroke-width="3" stroke-linejoin="round"/><polyline points="427,496 437,509 447,496" fill="none" stroke="#4675A8" stroke-width="4"/><polyline points="1291,335 1291,359" fill="none" stroke="#4675A8" stroke-width="3" stroke-linejoin="round"/><polyline points="1281,346 1291,359 1301,346" fill="none" stroke="#4675A8" stroke-width="4"/><polyline points="1291,485 1291,509" fill="none" stroke="#4675A8" stroke-width="3" stroke-linejoin="round"/><polyline points="1281,496 1291,509 1301,496" fill="none" stroke="#4675A8" stroke-width="4"/><polyline points="786,580 938,580" fill="none" stroke="#4675A8" stroke-width="3" stroke-linejoin="round"/><polyline points="925,570 938,580 925,590" fill="none" stroke="#4675A8" stroke-width="4"/><polyline points="1291,645 1291,708 244.5,708" fill="none" stroke="#4675A8" stroke-width="3" stroke-linejoin="round"/><polyline points="1291,708 1483.5,708" fill="none" stroke="#4675A8" stroke-width="3" stroke-linejoin="round"/><polyline points="244.5,708 244.5,742" fill="none" stroke="#4675A8" stroke-width="3" stroke-linejoin="round"/><polyline points="234.5,729 244.5,742 254.5,729" fill="none" stroke="#4675A8" stroke-width="4"/><polyline points="657.5,708 657.5,742" fill="none" stroke="#4675A8" stroke-width="3" stroke-linejoin="round"/><polyline points="647.5,729 657.5,742 667.5,729" fill="none" stroke="#4675A8" stroke-width="4"/><polyline points="1070.5,708 1070.5,742" fill="none" stroke="#4675A8" stroke-width="3" stroke-linejoin="round"/><polyline points="1060.5,729 1070.5,742 1080.5,729" fill="none" stroke="#4675A8" stroke-width="4"/><polyline points="1483.5,708 1483.5,742" fill="none" stroke="#4675A8" stroke-width="3" stroke-linejoin="round"/><polyline points="1473.5,729 1483.5,742 1493.5,729" fill="none" stroke="#4675A8" stroke-width="4"/><rect x="52" y="750" width="385" height="510" rx="15" fill="#FFFFFF" stroke="#82B1E4" stroke-width="2"/><rect x="465" y="750" width="385" height="510" rx="15" fill="#FFFFFF" stroke="#82B1E4" stroke-width="2"/><rect x="878" y="750" width="385" height="510" rx="15" fill="#FFFFFF" stroke="#82B1E4" stroke-width="2"/><rect x="1291" y="750" width="385" height="510" rx="15" fill="#FFFFFF" stroke="#82B1E4" stroke-width="2"/><polyline points="244.5,1260 244.5,1300" fill="none" stroke="#4675A8" stroke-width="3" stroke-linejoin="round"/><polyline points="657.5,1260 657.5,1300" fill="none" stroke="#4675A8" stroke-width="3" stroke-linejoin="round"/><polyline points="1070.5,1260 1070.5,1300" fill="none" stroke="#4675A8" stroke-width="3" stroke-linejoin="round"/><polyline points="1483.5,1260 1483.5,1300" fill="none" stroke="#4675A8" stroke-width="3" stroke-linejoin="round"/><polyline points="244.5,1300 1483.5,1300" fill="none" stroke="#4675A8" stroke-width="3" stroke-linejoin="round"/><polyline points="864,1300 864,1328" fill="none" stroke="#4675A8" stroke-width="3" stroke-linejoin="round"/><polyline points="854,1315 864,1328 874,1315" fill="none" stroke="#4675A8" stroke-width="4"/><rect x="284" y="1336" width="1160" height="102" rx="14" fill="#E8F3FF" stroke="#6CA5E4" stroke-width="2"/><text x="864" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="41" font-weight="700" fill="#17375E">From purchase records to four customer insights</text><text x="864" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#526F91">Train and select the models first, then analyse uploaded purchase records</text><text x="437" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#17375E">First, train and select the models</text><text x="1291" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#17375E">Then, upload data and generate results</text><text x="437" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#17375E">Clean transactions and retain valid purchases</text><text x="437" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#526F91">Remove duplicates, cancelled orders and other invalid records</text><text x="437" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#526F91">1,067,371 rows → 776,579 valid product lines</text><text x="437" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17375E">Create customer snapshots from monthly purchases</text><text x="437" y="441" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#526F91">Calculate customer features from purchases before each month</text><text x="437" y="473" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#526F91">Use the next 30 days' outcomes to train predictive models</text><text x="437" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17375E">Compare methods and save the selected models</text><text x="437" y="591" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#526F91">Train on earlier months and select methods on validation data</text><text x="437" y="623" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#526F91">Then review the fixed models on later months</text><text x="1291" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17375E">Upload purchase records and choose an analysis date</text><text x="1291" y="309" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#526F91">Any date from 2011-09-01 to 2011-12-01</text><text x="1291" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#17375E">Summarise purchases before the analysis date</text><text x="1291" y="441" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#526F91">Automatically create customer snapshots</text><text x="1291" y="473" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#526F91">and calculate the historical features needed by the models</text><text x="1291" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#17375E">Generate results using the trained models</text><text x="1291" y="591" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#526F91">Produce customer segments, repurchase scores, spending ranks</text><text x="1291" y="623" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526F91">and a product recommendation list for each customer</text><text x="244.5" y="795" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#17375E">1 | Customer segments</text><text x="244.5" y="835" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#526F91">Who buys in similar ways?</text><text x="244.5" y="880" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#17375E">K-means | 4 segments</text><text x="657.5" y="795" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#17375E">2 | Repurchase propensity</text><text x="657.5" y="835" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#526F91">Who may buy again within 30 days?</text><text x="657.5" y="880" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#17375E">XGBoost | 14 historical features</text><text x="1070.5" y="795" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#17375E">3 | Spending potential</text><text x="1070.5" y="835" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#526F91">Who has higher spending potential?</text><text x="1070.5" y="880" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#17375E">Two-stage LightGBM | 20 features</text><text x="1483.5" y="795" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#17375E">4 | Profiles &amp; recommendations</text><text x="1483.5" y="835" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#526F91">What might the customer buy next?</text><text x="1483.5" y="880" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#17375E">LightGBM classifier | 34 features</text><text x="244.5" y="934" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#17375E">Group customers by similarities</text><text x="244.5" y="970" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#17375E">in their purchase behaviour:</text><text x="244.5" y="1024" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#17375E">1  Long inactive</text><text x="244.5" y="1062" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#17375E">2  Recent frequent buyers</text><text x="244.5" y="1100" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#17375E">3  Recent low order value</text><text x="244.5" y="1138" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#17375E">4  Recent high order value</text><text x="244.5" y="1170" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526F91">Understand each segment's</text><text x="244.5" y="1204" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526F91">purchase patterns.</text><text x="657.5" y="934" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#17375E">Add each tree's adjustment,</text><text x="657.5" y="974" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#17375E">then convert the total into</text><text x="657.5" y="1014" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#17375E">a score between 0 and 1.</text><text x="657.5" y="1054" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#17375E">Rank customers by this score</text><text x="657.5" y="1094" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#17375E">to form the priority list.</text><text x="657.5" y="1170" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#526F91">Use AP to assess the overall ranking</text><text x="657.5" y="1204" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#526F91">and Precision@20% for list quality.</text><text x="1070.5" y="934" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#17375E">Estimate the probability of buying</text><text x="1070.5" y="974" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#17375E">within 30 days, then spending</text><text x="1070.5" y="1014" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#17375E">in those 30 days if they buy.</text><text x="1070.5" y="1054" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#17375E">Multiply the two estimates and</text><text x="1070.5" y="1094" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#17375E">select the top 20% of customers.</text><text x="1070.5" y="1170" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#526F91">Evaluate how much actual spending</text><text x="1070.5" y="1204" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526F91">the top 20% list captures.</text><text x="1483.5" y="934" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#17375E">Combine purchase history,</text><text x="1483.5" y="974" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#17375E">customer habits and relationships</text><text x="1483.5" y="1014" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#17375E">between products to score</text><text x="1483.5" y="1054" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#17375E">each candidate product.</text><text x="1483.5" y="1094" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#17375E">Recommend the top 10 products.</text><text x="1483.5" y="1170" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526F91">Use NDCG, Recall and Hit</text><text x="1483.5" y="1204" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#526F91">to assess hits and ranking quality.</text><text x="864" y="1377" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#17375E">View results in four pages, then filter and export the lists</text></svg>