[server]
fileWatcherType = "poll"
runOnSave = true

[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#f7faff"
secondaryBackgroundColor = "#eef4fc"
textColor = "#142b4b"
borderColor = "#e4ebf5"
linkColor = "#2563eb"

font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"

baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["28px", "22px", "18px", "15px", "13px", "12px"]
headingFontWeights = [600, 600, 600, 500, 500, 500]
linkUnderline = false

baseRadius = "8px"
buttonRadius = "7px"
showWidgetBorder = true
showSidebarBorder = true

chartCategoricalColors = ["#2458cd", "#5788e8", "#8fb2f4", "#bfd3fa"]

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#eef4fc"
textColor = "#142b4b"
borderColor = "#e4ebf5"
